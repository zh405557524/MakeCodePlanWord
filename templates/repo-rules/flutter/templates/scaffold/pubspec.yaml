name: your_project
description: A new Flutter project
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:     # 启用多语言时保留
    sdk: flutter

  # 状态管理
  get: ^4.6.6

  # 路由
  go_router: ^14.0.0

  # 网络
  dio: ^5.4.0

  # 本地存储（三选一，见 90-项目专属规则.mdc）
  get_storage: ^2.1.1

  # 屏幕适配（不启用则整体删掉，不要半启用）
  flutter_screenutil: ^5.9.0

  # 全局提示
  bot_toast: ^4.1.3

  # 应用信息
  package_info_plus: ^8.0.0

  # 国际化格式化
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
